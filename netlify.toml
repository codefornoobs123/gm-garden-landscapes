[build]
  command = "npx @11ty/eleventy"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Images moved from /img/ to /assets/img/ – keep old links (and Google Images) working
[[redirects]]
  from = "/img/*"
  to = "/assets/img/:splat"
  status = 301

[[redirects]]
  from = "/og-image.jpg"
  to = "/assets/img/og-image.jpg"
  status = 301

# The thank-you's "Save Gary's number" contact card opens as a contact on phones
[[headers]]
  for = "/contact.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=\"GM Garden Landscapes.vcf\""
